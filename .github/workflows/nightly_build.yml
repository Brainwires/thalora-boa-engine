name: Nightly Build
permissions:
  contents: read

# Schedule this workflow to run at midnight every day
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  runners:
    name: pick runners
    # Our self-hosted pools first, GitHub-hosted for the overflow: a job takes our pool only
    # while it has a free slot, else its GitHub image at once (fork pull requests: GitHub only).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@68d8c0c773592f5b99ed5e9b1ca009f0a1690e40 # pick-runners
        with:
          jobs: build_linux_x64=linux-x64
          vars: ${{ toJSON(vars) }}

  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pick: build_linux_x64
            binary_extension: ""
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary_extension: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_extension: ".exe"
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}')[matrix.pick] || matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release --locked --bin boa

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/boa${{ matrix.binary_extension }}
          asset_name: boa-${{ matrix.target }}${{ matrix.binary_extension }}
          tag: refs/tags/nightly
          overwrite: true
          prerelease: true
