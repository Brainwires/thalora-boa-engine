name: "CodeQL SAST Scanning"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

permissions:
  contents: read

jobs:
  runners:
    name: pick runners
    # Our self-hosted pools first, GitHub-hosted for the overflow: a job takes our pool only
    # while it has a free slot, else its GitHub image at once (fork pull requests: GitHub only).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@415ef1f9941d798b5760bf69f908be88789371a2 # pick-runners
        with:
          jobs: analyze=linux-x64
          vars: ${{ toJSON(vars) }}

  analyze:
    name: Analyze
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').analyze || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
      with:
        category: "/language:${{matrix.language}}"
