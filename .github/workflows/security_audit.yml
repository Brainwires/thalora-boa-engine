name: Security audit
on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
jobs:
  runners:
    name: pick runners
    # Our self-hosted pools first, GitHub-hosted for the overflow: a job takes our pool only
    # while it has a free slot, else its GitHub image at once (fork pull requests: GitHub only).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@415ef1f9941d798b5760bf69f908be88789371a2 # pick-runners
        with:
          jobs: audit=linux-x64
          vars: ${{ toJSON(vars) }}

  audit:
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').audit || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
